# อัปเดต dependency อัตโนมัติทุกสัปดาห์ (เปิดเป็น PR ให้ CI ตรวจก่อน merge)
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
